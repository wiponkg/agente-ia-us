[project]
name = "agente-user-story"
version = "0.0.1"
description = "Agente de IA que auxilia o Product Owner a gerar User Stories para o Azure DevOps a partir de contexto estruturado (produto, técnico, negócio, sprint, personas)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.1",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "google-genai>=1.42.0",
    "python-dotenv>=1.1.0",
    "rich>=13.9.4",
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
agente-user-story = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
